name: Build release

# Builds the onedir app on Windows, macOS and Linux, stages the BBP engine and
# the Breeze style into each build, smoke-tests the frozen binaries, and on
# release events uploads Velopack packages and portable archives.
#
# Breeze is required on every platform; there is no build without it. On
# Windows and macOS, scripts/stage_breeze.py builds breeze-icons, kcolorscheme
# and kiconthemes from pinned KDE sources against the pinned official Qt SDK
# (KDE Craft's binaries of those three need a zstd-enabled Qt Core); see the
# 'rebuild' sections of scripts/breeze_craft_pins.json.
#
# Velopack: Windows (win-x64) gets Setup.exe, a Velopack portable zip and
# update packages; it is the only platform that updates in place. Linux gets a
# Velopack AppImage feed (no in-app updates yet). macOS gets a plain archive,
# because Velopack's macOS packages must be code-signed and notarized.

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Keep in lockstep with the velopack pin in pyproject.toml.
  VPK_VERSION: "1.2.161"
  PACK_ID: GambitPairing
  PACK_TITLE: Gambit Pairing
  PACK_AUTHORS: Gambit Pairing developers
  PYTHON_VERSION: "3.12"
  # Build tools for the KDE frameworks rebuilt on Windows and macOS.
  CMAKE_VERSION: "4.4.4"
  NINJA_VERSION: "1.13.2"
  LXML_VERSION: "6.1.3"

jobs:
  checks:
    uses: ./.github/workflows/tests.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read and check the app version
        id: version
        shell: bash
        run: |
          version=$(python3 -c "exec(open('src/gambitpairing/_version.py').read()); print(__version__)")
          echo "App version: $version"
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
            # The in-app update check compares the release tag with __version__,
            # and Velopack packages are versioned with __version__. They must agree.
            if [ "$tag" != "v$version" ]; then
              echo "::error::Release tag '$tag' does not match v$version from _version.py"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: [checks, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x86_64
            artifact: windows-x64
            exe: gambit-pairing.exe
            velopack: true
            vpk_runtime: win-x64
            vpk_channel: win
            vpk_icon: src/gambitpairing/resources/icons/icon.ico
          - os: macos-latest
            target: macos-arm64
            artifact: macos-arm64
            exe: gambit-pairing
            velopack: false
          - os: ubuntu-24.04
            target: linux-x86_64
            artifact: linux-x86_64
            exe: gambit-pairing
            velopack: true
            vpk_runtime: linux-x64
            vpk_channel: linux
            vpk_icon: src/gambitpairing/resources/icons/icon.png
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Linux build and runtime packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxcb-keysyms1 \
            libxcb-res0 libwayland-client0 libwayland-cursor0 p7zip-full squashfs-tools

      - name: Install 7-Zip (macOS)
        if: runner.os == 'macOS'
        run: command -v 7z || command -v 7zz || brew install sevenzip

      - name: Set up MSYS2 UCRT64 toolchain for the engine (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          path-type: inherit
          install: >-
            make
            patch
            mingw-w64-ucrt-x86_64-gcc

      - name: Build and stage the BBP engine (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: python scripts/build_bbp.py --static --jobs 4

      - name: Build and stage the BBP engine (Linux)
        if: runner.os == 'Linux'
        run: python scripts/build_bbp.py --jobs 4

      - name: Build and stage the BBP engine (macOS)
        if: runner.os == 'macOS'
        run: python scripts/build_bbp.py --comp clang --jobs 4

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # Bundle the Qt that the Breeze binaries and the rebuilt frameworks
          # were checked against (qt_sdks.version in the pins).
          qt_version=$(python -c "import json; print(json.load(open('scripts/breeze_craft_pins.json'))['qt_sdks']['version'])")
          python -m pip install ".[dev]" "PyQt6-Qt6==${qt_version}"

      - name: Install KDE framework build tools (Windows, macOS)
        if: runner.os != 'Linux'
        shell: bash
        run: python -m pip install "cmake==${CMAKE_VERSION}" "ninja==${NINJA_VERSION}" "lxml==${LXML_VERSION}"

      - name: Install gettext (macOS)
        if: runner.os == 'macOS'
        # KF6I18n's CMake package requires msgfmt and msgmerge. Only the
        # frameworks' own translations are built with them; none are shipped.
        run: command -v msgfmt || brew install gettext

      - name: Set up the MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Cache pinned Breeze downloads
        uses: actions/cache@v4
        with:
          # Only SHA-256-pinned downloads; stage_breeze.py verifies each file.
          path: build/breeze-cache
          key: breeze-downloads-${{ matrix.target }}-${{ hashFiles('scripts/breeze_craft_pins.json') }}

      - name: Stage the Breeze style
        # Default shell (pwsh on Windows): Git Bash would put its own link.exe
        # ahead of MSVC's. A short work directory keeps breeze-icons' deep
        # paths under the Windows path limit.
        run: python scripts/stage_breeze.py --target ${{ matrix.target }} --work-dir "${{ runner.temp }}/kf6"

      - name: Build onedir executable
        shell: bash
        run: python scripts/make_executable.py --skip-deps

      - name: Smoke-test frozen application (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "dist\gambit-pairing\${{ matrix.exe }}"
          foreach ($check in @("--smoke-test", "--verify-native-style")) {
            $process = Start-Process -FilePath $exe -ArgumentList $check -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "$check failed for $exe" }
          }

      - name: Smoke-test frozen application (macOS, Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          exe="dist/gambit-pairing/${{ matrix.exe }}"
          "$exe" --smoke-test
          # Hide any host Qt plugins; the frozen app must use its bundled Breeze.
          mkdir -p "$RUNNER_TEMP/no-qt-plugins"
          env -u QT_QPA_PLATFORM_PLUGIN_PATH QT_PLUGIN_PATH="$RUNNER_TEMP/no-qt-plugins" \
            "$exe" --verify-native-style | tee native-style.log
          grep -q "style=breeze" native-style.log

      - name: Create portable archive
        shell: bash
        run: |
          mkdir -p out
          base="gambit-pairing-${VERSION}-${{ matrix.artifact }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            archive="out/${base}-portable.zip"
            7z a -tzip "$archive" ./dist/gambit-pairing/* > /dev/null
          else
            archive="out/${base}.tar.gz"
            tar -C dist -czf "$archive" gambit-pairing
          fi
          (cd out && python -c "import hashlib,sys; p=sys.argv[1]; print(hashlib.sha256(open(p,'rb').read()).hexdigest() + '  ' + p)" "$(basename "$archive")" > "$(basename "$archive").sha256")
          ls -la out

      - name: Set up .NET for vpk
        if: matrix.velopack
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install vpk
        if: matrix.velopack
        run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}

      - name: Download previous Velopack release (for delta packages)
        if: matrix.velopack && github.event_name == 'release'
        # Deltas are optional; the first Velopack release has nothing to download.
        continue-on-error: true
        shell: bash
        run: >-
          vpk download github
          --repoUrl "${{ github.server_url }}/${{ github.repository }}"
          --channel ${{ matrix.vpk_channel }}
          --token "${{ secrets.GITHUB_TOKEN }}"
          -o Releases

      - name: Pack with Velopack
        if: matrix.velopack
        shell: bash
        run: >-
          vpk pack
          --packId "$PACK_ID"
          --packVersion "$VERSION"
          --packDir dist/gambit-pairing
          --mainExe ${{ matrix.exe }}
          --packTitle "$PACK_TITLE"
          --packAuthors "$PACK_AUTHORS"
          --icon ${{ matrix.vpk_icon }}
          --runtime ${{ matrix.vpk_runtime }}
          --channel ${{ matrix.vpk_channel }}
          -o Releases

      - name: Upload portable archive
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.artifact }}
          path: out/
          retention-days: 30

      - name: Upload Velopack release files
        if: matrix.velopack
        uses: actions/upload-artifact@v4
        with:
          name: velopack-${{ matrix.vpk_channel }}
          path: Releases/
          retention-days: 30

  publish:
    if: github.event_name == 'release'
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install vpk
        run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}

      - name: Upload Velopack packages to the release
        shell: bash
        run: |
          for channel in win linux; do
            vpk upload github \
              --repoUrl "${{ github.server_url }}/${{ github.repository }}" \
              --token "${{ secrets.GITHUB_TOKEN }}" \
              --tag "${{ github.event.release.tag_name }}" \
              --merge \
              --channel "$channel" \
              -o "artifacts/velopack-$channel"
          done

      - name: Upload portable archives to the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/portable-*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
